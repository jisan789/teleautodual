services:
  - type: web
    name: telegram-broadcast-service
    env: python
    plan: free # Change to starter ($7/mo) if you prefer zero sleep without keep-alive
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONIOENCODING
        value: "utf-8"
      - key: CONFIG_URL
        value: "https://cdn.jisanfx.top/teleauto/dualconfig.json"
      # Account 1 Credentials (optional overrides if not in code)
      # - key: TELEGRAM_API_ID_1
      #   sync: false
      # - key: TELEGRAM_API_HASH_1
      #   sync: false
      # - key: TELEGRAM_SESSION_1
      #   sync: false
      # Account 2 Credentials
      # - key: TELEGRAM_API_ID_2
      #   sync: false
      # - key: TELEGRAM_API_HASH_2
      #   sync: false
      # - key: TELEGRAM_SESSION_2
      #   sync: false
