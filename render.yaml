services:
  - type: web
    name: loop-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false   # Set this manually in Render dashboard
      - key: TELEGRAM_CHAT_ID
        sync: false   # Set this manually in Render dashboard
